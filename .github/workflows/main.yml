name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_call:

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners

jobs:
  windows:
    name: 'Windows (JDK 11)'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: 'Set up JDK 11'
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'zulu'
    - name: 'Test'
      shell: cmd
      run: |
        ./gradlew --no-parallel --no-daemon build javadoc
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: 'Looker JDBC Windows (JDK 11)'
          path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk8:
    name: 'Linux (JDK 8)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Set up JDK 8'
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon tasks build javadoc
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 8)'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk11-oldest-guava-tz:
    name: 'Linux (JDK 11), Oldest Guava, Pacific-Chatham Timezone'
    runs-on: ubuntu-latest
    env:
      GUAVA: 14.0.1 # oldest supported Guava version
      TZ: Pacific/Chatham # flips between +12:45 and +13:45
    steps:
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon -Pguava.version=${GUAVA:-14.0.1} build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 11), Oldest Guava, Pacific-Chatham Timezone'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk11-minimum-guava-tz:
    name: 'Linux (JDK 11), Calcite Minimum Guava, America-New_York Timezone'
    runs-on: ubuntu-latest
    env:
      GUAVA: '19.0' # Calcite's minimum Guava version
      TZ: America/New_York # flips between −05:00 and −04:00
    steps:
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon -Pguava.version=${GUAVA:-14.0.1} tasks build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 11), Calcite Minimum Guava, America-New_York Timezone'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk11-middle-aged-guava:
    name: 'Linux (JDK 11), Middle-Aged Guava'
    runs-on: ubuntu-latest
    env:
      GUAVA: '23.0' # a middle-aged Guava version
    steps:
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          # Disable getLicenses for Guava 22..29 because of [CALCITE-4815]
          ./gradlew --no-parallel --no-daemon -Pguava.version=${GUAVA:-14.0.1} build -x :standalone-server:licenseCopySpec -x :standalone-server:getLicenses -x :standalone-server:license -x :tck:licenseCopySpec -x :tck:getLicenses -x :tck:license
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 11), Middle-Aged Guava'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk11-newest-guava:
    name: 'Linux (JDK 11), Newest Guava'
    runs-on: ubuntu-latest
    env:
      GUAVA: 33.4.0-jre # newest supported Guava version
    steps:
      - name: 'Set up JDK 11'
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon -Pguava.version=${GUAVA:-14.0.1} build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 11), Newest Guava'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk17:
    name: 'Linux (JDK 17)'
    runs-on: ubuntu-latest
    steps:
    - name: 'Set up JDK 17'
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'zulu'
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: 'Test'
      run: |
        ./gradlew --no-parallel --no-daemon build javadoc
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: 'Looker JDBC Linux (JDK 17)'
          path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk21:
    name: 'Linux (JDK 21)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 21)'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  mac:
    name: 'macOS (JDK 21)'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 50
    - name: 'Set up JDK 21'
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'zulu'
    - name: 'Test'
      run: |
        ./gradlew --no-parallel --no-daemon tasks build javadoc
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: 'Looker JDBC macOS (JDK 21)'
          path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar

  linux-jdk23:
    name: 'Linux (JDK 23)'
    runs-on: ubuntu-latest
    steps:
      - name: 'Set up JDK 23'
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: 'zulu'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 'Test'
        run: |
          ./gradlew --no-parallel --no-daemon build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: 'Looker JDBC Linux (JDK 23)'
            path: ${{github.workspace}}/core/build/libs/avatica-core-*-SNAPSHOT.jar
